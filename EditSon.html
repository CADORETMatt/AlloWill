<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Editeur de sample — Violet / Noir</title>
    <style>
        :root {
            --bg: #0b0011;
            /* très foncé violet/noir */
            --panel: #12021a;
            /* panel sombre */
            --accent: #9b59ff;
            /* violet vif */
            --accent-2: #6f3bd1;
            --text: #eae6ff;
            --muted: #9b8fb5;
            --success: #42f57b;
            --changed: #4ad0ff;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 18px;
            font-family: "Segoe UI", Roboto, Arial;
            background: linear-gradient(180deg, var(--bg), #050007);
            color: var(--text);
        }

        .card {
            background: linear-gradient(180deg, var(--panel), #0b0210);
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.7);
            max-width: 820px
        }

        h1 {
            color: var(--accent);
            margin: 0 0 12px 0
        }

        label {
            display: block;
            margin-top: 10px;
            color: var(--muted);
            font-size: 0.95rem
        }

        input[type="file"] {
            color: var(--text)
        }

        input[type="number"],
        input[type="text"],
        select {
            width: 150px;
            padding: 8px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid rgba(155, 89, 255, 0.12);
            background: #07030a;
            color: var(--text)
        }

        button {
            background: var(--accent);
            color: #070007;
            border: none;
            padding: 8px 12px;
            margin: 8px 6px 0 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600
        }

        button.secondary {
            background: transparent;
            color: var(--accent);
            border: 1px solid rgba(155, 89, 255, 0.18)
        }

        #downloadLink {
            display: inline-block;
            margin-top: 12px;
            text-decoration: none;
            font-weight: 700
        }

        #downloadLink.valid {
            color: var(--success)
        }

        #downloadLink.changed {
            color: var(--changed)
        }

        .meta {
            margin-top: 8px;
            color: var(--muted)
        }

        .row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap
        }

        .col {
            display: flex;
            gap: 8px;
            align-items: center
        }

        small.note {
            color: var(--muted)
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🎛️ Editeur de sample</h1>
        <p class="meta">Fichier source local — durée affichée en <strong>min:sec:ms</strong>. Réverb simple incluse.</p>

        <!-- NOTE: fichier utilisateur upload local path (for dev): /mnt/data/AlloWill.js -->

        <label>Choisir un fichier audio</label>
        <input id="audioFile" type="file" accept="audio/*">

        <div class="row">
            <div>
                <label>Durée totale</label>
                <div id="totalDuration">00:00.000</div>
            </div>
            <div>
                <label>Nom du sample (fichier export)</label>
                <input id="sampleName" type="text" value="sample.wav">
            </div>
        </div>

        <label>Début (min:sec:ms)</label>
        <input id="startInput" type="text" value="00:00:000" placeholder="00:00:000">

        <label>Fin (min:sec:ms)</label>
        <input id="endInput" type="text" value="00:02:000" placeholder="00:02:000">

        <div class="row">
            <div>
                <label>Boucles</label>
                <input id="loopsInput" type="number" min="1" value="1">
            </div>
            <div>
                <label>Réverbération (%)</label>
                <input id="reverbInput" type="number" min="0" max="100" value="0">
            </div>
        </div>

        <div style="margin-top:12px">
            <button id="previewBtn">▶ Prévisualiser</button>
            <button id="stopBtn" class="secondary">■ Stop</button>
            <button id="saveBtn">💾 Enregistrer</button>
            <small class="note"> &nbsp; (lien disparaît dès modification)</small>
        </div>

        <div style="margin-top:12px">
            <a id="downloadLink" href="#" download class="">Télécharger le sample</a>
        </div>

        <div id="saveStatus" class="meta"></div>
    </div>

    <script>
        // Globals
        let audioBuffer = null;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let currentSource = null; // for preview playback
        let lastBlobUrl = null;    // track last export URL
        let modified = false;

        // helpers: parse and format time mm:ss:ms
        function parseTimeStr(str) {
            // Accept formats mm:ss:ms or ss:ms or seconds decimals
            if (!str) return 0;
            if (/^\d+:\d{2}:\d{3}$/.test(str)) {
                const [m, s, ms] = str.split(':').map(Number); return m * 60000 + s * 1000 + ms;
            }
            if (/^\d+:\d{2}$/.test(str)) { const [m, s] = str.split(':').map(Number); return m * 60000 + s * 1000; }
            if (/^[0-9]+(\.[0-9]+)?$/.test(str)) { return Math.floor(parseFloat(str) * 1000); }
            return 0; // fallback
        }
        function fmtMs(ms) {
            ms = Math.max(0, Math.floor(ms));
            const m = Math.floor(ms / 60000); ms %= 60000;
            const s = Math.floor(ms / 1000); const milli = ms % 1000;
            return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + ':' + String(milli).padStart(3, '0');
        }

        // UI refs
        const audioFile = document.getElementById('audioFile');
        const totalDuration = document.getElementById('totalDuration');
        const startInput = document.getElementById('startInput');
        const endInput = document.getElementById('endInput');
        const loopsInput = document.getElementById('loopsInput');
        const reverbInput = document.getElementById('reverbInput');
        const previewBtn = document.getElementById('previewBtn');
        const stopBtn = document.getElementById('stopBtn');
        const saveBtn = document.getElementById('saveBtn');
        const downloadLink = document.getElementById('downloadLink');
        const sampleName = document.getElementById('sampleName');
        const saveStatus = document.getElementById('saveStatus');

        // mark changed: hide download link and revoke previous blob
        function markChanged() {
            modified = true;
            downloadLink.style.display = 'none';
            downloadLink.className = '';
            saveStatus.textContent = '';
            if (lastBlobUrl) { URL.revokeObjectURL(lastBlobUrl); lastBlobUrl = null; }
        }

        // wire inputs to markChanged
        [startInput, endInput, loopsInput, reverbInput, sampleName].forEach(el => {
            el.addEventListener('input', markChanged, { passive: true });
        });

        // load file
        audioFile.addEventListener('change', async (e) => {
            const f = e.target.files && e.target.files[0];
            if (!f) return;
            markChanged();
            const ab = await f.arrayBuffer();
            audioCtx.decodeAudioData(ab).then(buf => {
                audioBuffer = buf;
                const dms = Math.floor(buf.duration * 1000);
                totalDuration.textContent = fmtMs(dms);
                // set end input default to file end
                endInput.value = fmtMs(dms);
            });
        });

        // stop preview
        function stopPreview() {
            if (currentSource) {
                try { currentSource.stop(); } catch (e) { }
                try { currentSource.disconnect(); } catch (e) { }
                currentSource = null;
            }
        }
        stopBtn.addEventListener('click', stopPreview, { passive: true });

        // create a simple impulse response for reverb
        function createImpulse(percent) {
            const seconds = 0.2 + (percent / 100) * 1.2; // between 0.2s and 1.4s
            const len = Math.floor(audioCtx.sampleRate * seconds);
            const ir = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
            for (let c = 0; c < 2; c++) {
                const data = ir.getChannelData(c);
                for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
            }
            return ir;
        }

        // preview
        previewBtn.addEventListener('click', async () => {
            if (!audioBuffer) { alert('Charge d\'abord un fichier'); return; }
            stopPreview();
            const startMs = parseTimeStr(startInput.value);
            const endMs = parseTimeStr(endInput.value);
            if (endMs <= startMs) { alert('Fin doit être > début'); return; }
            const loops = Math.max(1, parseInt(loopsInput.value) || 1);
            const rev = Math.max(0, Math.min(100, parseInt(reverbInput.value) || 0));

            // build short buffer for the slice
            const startS = startMs / 1000, endS = endMs / 1000;
            const frameCount = Math.floor((endS - startS) * audioBuffer.sampleRate);
            const sliceBuf = audioCtx.createBuffer(audioBuffer.numberOfChannels, frameCount, audioBuffer.sampleRate);
            for (let c = 0; c < audioBuffer.numberOfChannels; c++) {
                const src = audioBuffer.getChannelData(c);
                const dst = sliceBuf.getChannelData(c);
                const startIndex = Math.floor(startS * audioBuffer.sampleRate);
                for (let i = 0; i < frameCount; i++) dst[i] = src[startIndex + i] || 0;
            }

            // apply simple reverb by routing through convolver if requested
            let outNode;
            if (rev > 0) {
                const convolver = audioCtx.createConvolver();
                convolver.buffer = createImpulse(rev);
                outNode = convolver;
            }

            // build final looped buffer
            const finalBuf = audioCtx.createBuffer(sliceBuf.numberOfChannels, sliceBuf.length * loops, sliceBuf.sampleRate);
            for (let c = 0; c < sliceBuf.numberOfChannels; c++) {
                const fdata = finalBuf.getChannelData(c);
                const sdata = sliceBuf.getChannelData(c);
                for (let L = 0; L < loops; L++) fdata.set(sdata, L * sliceBuf.length);
            }

            // create source and play
            const src = audioCtx.createBufferSource();
            src.buffer = finalBuf;
            if (outNode) { src.connect(outNode); outNode.connect(audioCtx.destination); }
            else src.connect(audioCtx.destination);
            currentSource = src;
            src.start();
        });

        // save/export: create WAV and auto-download
        saveBtn.addEventListener('click', () => {
            if (!audioBuffer) { alert('Charge d\'abord un fichier'); return; }
            const startMs = parseTimeStr(startInput.value);
            const endMs = parseTimeStr(endInput.value);
            if (endMs <= startMs) { alert('Fin doit être > début'); return; }
            const loops = Math.max(1, parseInt(loopsInput.value) || 1);
            const rev = Math.max(0, Math.min(100, parseInt(reverbInput.value) || 0));

            // prepare slice
            const startS = startMs / 1000, endS = endMs / 1000;
            const frameCount = Math.floor((endS - startS) * audioBuffer.sampleRate);
            const sliceBuf = audioCtx.createBuffer(audioBuffer.numberOfChannels, frameCount, audioBuffer.sampleRate);
            for (let c = 0; c < audioBuffer.numberOfChannels; c++) {
                const srcdata = audioBuffer.getChannelData(c);
                const dst = sliceBuf.getChannelData(c);
                const sidx = Math.floor(startS * audioBuffer.sampleRate);
                for (let i = 0; i < frameCount; i++) dst[i] = srcdata[sidx + i] || 0;
            }

            // naive reverb (in-place) if requested
            const workBuf = (rev > 0) ? applySimpleReverb(sliceBuf, rev) : sliceBuf;

            // make looped final buffer
            const finalBuf = audioCtx.createBuffer(workBuf.numberOfChannels, workBuf.length * loops, workBuf.sampleRate);
            for (let c = 0; c < workBuf.numberOfChannels; c++) {
                const out = finalBuf.getChannelData(c);
                const s = workBuf.getChannelData(c);
                for (let L = 0; L < loops; L++) out.set(s, L * workBuf.length);
            }

            // WAV creation (16-bit PCM)
            const wavBuffer = bufferToWav(finalBuf);
            const blob = new Blob([wavBuffer], { type: 'audio/wav' });

            // revoke previous URL
            if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
            lastBlobUrl = URL.createObjectURL(blob);

            // set link and auto-download
            const filename = (sampleName.value || 'sample') + (sampleName.value && sampleName.value.endsWith('.wav') ? '' : '.wav');
            downloadLink.href = lastBlobUrl;
            downloadLink.download = filename;
            downloadLink.textContent = 'Télécharger le sample';
            downloadLink.style.display = 'inline-block';
            downloadLink.className = modified ? 'changed' : 'valid';
            modified = false;

            // trigger automatic download
            const a = document.createElement('a');
            a.href = lastBlobUrl; a.download = filename; document.body.appendChild(a); a.click(); a.remove();

            saveStatus.textContent = 'Sample exporté et téléchargement lancé';
        });

        function applySimpleReverb(buf, percent) {
            // simple comb-like reverb: cheap convolution-ish by mixing delayed taps
            const ch = buf.numberOfChannels; const len = buf.length; const sr = buf.sampleRate;
            const out = audioCtx.createBuffer(ch, len, sr);
            const decay = percent / 100 * 0.6; // scale
            for (let c = 0; c < ch; c++) {
                const inp = buf.getChannelData(c); const outd = out.getChannelData(c);
                for (let i = 0; i < len; i++) {
                    let v = inp[i];
                    // add a few taps
                    const t1 = i - Math.floor(0.03 * sr); if (t1 >= 0) v += inp[t1] * decay * 0.6;
                    const t2 = i - Math.floor(0.06 * sr); if (t2 >= 0) v += inp[t2] * decay * 0.35;
                    const t3 = i - Math.floor(0.11 * sr); if (t3 >= 0) v += inp[t3] * decay * 0.15;
                    outd[i] = v;
                }
            }
            return out;
        }

        function bufferToWav(abuffer) {
            const numChannels = abuffer.numberOfChannels;
            const sampleRate = abuffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;
            const dataSize = abuffer.length * blockAlign;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            function writeString(view, offset, string) { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); }
            let offset = 0;
            writeString(view, offset, 'RIFF'); offset += 4;
            view.setUint32(offset, 36 + dataSize, true); offset += 4;
            writeString(view, offset, 'WAVE'); offset += 4;
            writeString(view, offset, 'fmt '); offset += 4;
            view.setUint32(offset, 16, true); offset += 4;
            view.setUint16(offset, format, true); offset += 2;
            view.setUint16(offset, numChannels, true); offset += 2;
            view.setUint32(offset, sampleRate, true); offset += 4;
            view.setUint32(offset, sampleRate * blockAlign, true); offset += 4;
            view.setUint16(offset, blockAlign, true); offset += 2;
            view.setUint16(offset, bitDepth, true); offset += 2;
            writeString(view, offset, 'data'); offset += 4;
            view.setUint32(offset, dataSize, true); offset += 4;

            // write interleaved samples
            let pos = 44;
            const channels = [];
            for (let i = 0; i < numChannels; i++) channels.push(abuffer.getChannelData(i));
            for (let i = 0; i < abuffer.length; i++) {
                for (let ch = 0; ch < numChannels; ch++) {
                    let sample = Math.max(-1, Math.min(1, channels[ch][i]));
                    view.setInt16(pos, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                    pos += 2;
                }
            }
            return view.buffer;
        }

        // add passive:true for touch events to avoid console violation
        ['touchstart', 'touchmove'].forEach(evt => {
            window.addEventListener(evt, () => { }, { passive: true });
        });

    </script>
</body>

</html>
